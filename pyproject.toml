[project]
name = "mvp-soyuzpribor"
version = "0.1.0"
description = "AI-помощник для подготовки товарных описаний B2B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

